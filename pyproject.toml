[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-database"
version = "0.1.0"
description = "Build and query a SQLite database of magnetic space group operations from spglib."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "spglib",
]

[project.scripts]
msg-database = "msg_database.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.9"
